
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0b1326;
    --bg-dim: #060e20;
    --bg-low: #131b2e;
    --bg-mid: #171f33;
    --bg-hi: #222a3d;
    --bg-top: #2d3449;
    --surface: #1a2440;
    --on-bg: #dae2fd;
    --on-bg-muted: #8b9ab8;
    --on-bg-dim: #5c6b85;
    --outline: #2e3a52;
    --outline-hi: #3e4f6e;
    --cyan: #56b4d3;
    --cyan-bright: #7ecfeb;
    --cyan-dim: #2a6a85;
    --amber: #f5a623;
    --amber-dim: #7a5010;
    --red: #e05252;
    --red-dim: #6b2222;
    --green: #4caf7d;
    --green-dim: #1e5a3a;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Inter', sans-serif;
  }

  body { background: var(--bg); color: var(--on-bg); font-family: var(--sans); font-size: 13px; line-height: 1.5; height: 100%; overflow: hidden; }

  .app { display: flex; height: 720px; width: 100%; position: relative; overflow: hidden; background: var(--bg); }

  /* Grid background */
  .app::before {
    content: ''; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(86,180,211,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(86,180,211,0.04) 1px, transparent 1px);
    background-size: 32px 32px; pointer-events: none; z-index: 0;
  }

  /* SIDEBAR */
  .sidebar {
    width: 200px; min-width: 200px; background: var(--bg-dim); border-right: 1px solid var(--outline);
    display: flex; flex-direction: column; z-index: 10; position: relative; flex-shrink: 0;
  }

  .logo-area {
    padding: 16px; border-bottom: 1px solid var(--outline);
    display: flex; align-items: center; gap: 10px;
  }

  .logo-icon {
    width: 32px; height: 32px; background: var(--cyan-dim); border: 1px solid var(--cyan); border-radius: 6px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }

  .logo-icon svg { width: 18px; height: 18px; stroke: var(--cyan-bright); fill: none; stroke-width: 1.5; }

  .logo-text { font-family: var(--sans); }
  .logo-text .brand { font-size: 12px; font-weight: 700; color: var(--on-bg); letter-spacing: 0.05em; }
  .logo-text .sub { font-family: var(--mono); font-size: 9px; color: var(--cyan); letter-spacing: 0.12em; text-transform: uppercase; margin-top: 1px; }

  .nav-section { padding: 12px 8px; flex: 1; }
  .nav-label { font-family: var(--mono); font-size: 9px; color: var(--on-bg-dim); letter-spacing: 0.12em; text-transform: uppercase; padding: 0 8px; margin-bottom: 6px; margin-top: 12px; }

  .nav-item {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 4px; cursor: pointer;
    font-size: 12px; color: var(--on-bg-muted); font-weight: 500; position: relative; transition: all 0.15s;
    margin-bottom: 2px; border: 1px solid transparent;
  }
  .nav-item:hover { background: var(--bg-hi); color: var(--on-bg); }
  .nav-item.active { background: rgba(86,180,211,0.1); color: var(--cyan-bright); border-color: rgba(86,180,211,0.2); }
  .nav-item.active::before {
    content: ''; position: absolute; left: -1px; top: 6px; bottom: 6px; width: 2px;
    background: var(--cyan); border-radius: 1px;
  }
  .nav-item svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.5; flex-shrink: 0; }

  .sidebar-bottom { padding: 12px 8px; border-top: 1px solid var(--outline); }
  .user-chip { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 4px; }
  .user-avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--cyan-dim); border: 1px solid var(--cyan); display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 9px; font-weight: 700; color: var(--cyan-bright); flex-shrink: 0; }
  .user-info .name { font-size: 11px; font-weight: 600; color: var(--on-bg); }
  .user-info .role { font-family: var(--mono); font-size: 9px; color: var(--on-bg-dim); letter-spacing: 0.08em; }

  /* MAIN CONTENT */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; z-index: 1; }

  .topbar {
    height: 48px; border-bottom: 1px solid var(--outline); background: var(--bg-low);
    display: flex; align-items: center; padding: 0 16px; gap: 12px; flex-shrink: 0;
  }

  .topbar-title { font-size: 13px; font-weight: 600; color: var(--on-bg); }
  .topbar-breadcrumb { font-family: var(--mono); font-size: 10px; color: var(--on-bg-dim); letter-spacing: 0.06em; display: flex; align-items: center; gap: 6px; }
  .topbar-breadcrumb span { color: var(--cyan-dim); }

  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }

  .filter-chip {
    display: flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 3px;
    border: 1px solid var(--outline-hi); background: var(--bg-hi); cursor: pointer;
    font-family: var(--mono); font-size: 10px; color: var(--on-bg-muted); letter-spacing: 0.06em;
    transition: all 0.15s;
  }
  .filter-chip:hover, .filter-chip.active { border-color: var(--cyan-dim); color: var(--cyan); background: rgba(86,180,211,0.08); }
  .filter-chip svg { width: 11px; height: 11px; stroke: currentColor; fill: none; }

  .page-content { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 16px; position: relative; }
  .page-content::-webkit-scrollbar { width: 4px; }
  .page-content::-webkit-scrollbar-track { background: transparent; }
  .page-content::-webkit-scrollbar-thumb { background: var(--outline-hi); border-radius: 2px; }

  /* STATUS CHIPS */
  .chip {
    display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 3px;
    font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  }
  .chip-cyan { background: rgba(86,180,211,0.15); color: var(--cyan); border: 1px solid rgba(86,180,211,0.3); }
  .chip-amber { background: rgba(245,166,35,0.15); color: var(--amber); border: 1px solid rgba(245,166,35,0.3); }
  .chip-red { background: rgba(224,82,82,0.15); color: var(--red); border: 1px solid rgba(224,82,82,0.3); }
  .chip-green { background: rgba(76,175,125,0.15); color: var(--green); border: 1px solid rgba(76,175,125,0.3); }
  .chip-gray { background: rgba(139,154,184,0.12); color: var(--on-bg-muted); border: 1px solid var(--outline-hi); }
  .chip-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

  /* PANELS */
  .panel {
    background: var(--bg-mid); border: 1px solid var(--outline); border-radius: 6px; overflow: hidden;
  }
  .panel-header {
    padding: 10px 14px; border-bottom: 1px solid var(--outline); display: flex; align-items: center; gap: 8px;
    background: var(--bg-low);
  }
  .panel-header-title { font-family: var(--mono); font-size: 10px; font-weight: 700; color: var(--on-bg-muted); letter-spacing: 0.1em; text-transform: uppercase; }
  .panel-header-title-k { font-size: 11px; font-weight: 600; color: var(--on-bg); font-family: var(--sans); letter-spacing: 0; }
  .panel-body { padding: 12px 14px; }

  /* BUTTONS */
  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 4px;
    font-size: 11px; font-weight: 600; cursor: pointer; border: 1px solid; transition: all 0.15s;
  }
  .btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 1.5; }
  .btn-primary { background: rgba(86,180,211,0.2); color: var(--cyan-bright); border-color: var(--cyan-dim); }
  .btn-primary:hover { background: rgba(86,180,211,0.3); }
  .btn-secondary { background: transparent; color: var(--on-bg-muted); border-color: var(--outline-hi); }
  .btn-secondary:hover { border-color: var(--cyan-dim); color: var(--cyan); }
  .btn-amber { background: rgba(245,166,35,0.15); color: var(--amber); border-color: rgba(245,166,35,0.3); }

  /* GRID LAYOUTS */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px; }

  /* STAT CARD */
  .stat-card { background: var(--bg-hi); border: 1px solid var(--outline); border-radius: 5px; padding: 12px 14px; }
  .stat-label { font-family: var(--mono); font-size: 9px; color: var(--on-bg-dim); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 4px; }
  .stat-value { font-family: var(--mono); font-size: 22px; font-weight: 700; color: var(--on-bg); }
  .stat-sub { font-size: 10px; color: var(--on-bg-muted); margin-top: 3px; }
  .stat-value.cyan { color: var(--cyan); }
  .stat-value.amber { color: var(--amber); }
  .stat-value.green { color: var(--green); }

  /* VIDEO CARDS */
  .video-card {
    background: var(--bg-hi); border: 1px solid var(--outline); border-radius: 5px; overflow: hidden; cursor: pointer; transition: all 0.15s;
  }
  .video-card:hover { border-color: var(--cyan-dim); }
  .video-thumb { height: 90px; background: linear-gradient(135deg, var(--bg-dim), var(--bg-hi)); position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .video-thumb-bg { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(86,180,211,0.1) 0%, transparent 70%); }
  .play-btn { width: 32px; height: 32px; border-radius: 50%; background: rgba(86,180,211,0.25); border: 1px solid rgba(86,180,211,0.5); display: flex; align-items: center; justify-content: center; z-index: 1; }
  .play-btn svg { width: 14px; height: 14px; stroke: var(--cyan-bright); fill: var(--cyan-bright); }
  .video-duration { position: absolute; bottom: 6px; right: 6px; font-family: var(--mono); font-size: 9px; color: var(--on-bg); background: rgba(0,0,0,0.7); padding: 1px 5px; border-radius: 2px; }
  .video-info { padding: 10px; }
  .video-title { font-size: 11px; font-weight: 600; color: var(--on-bg); margin-bottom: 5px; line-height: 1.4; }
  .video-meta { display: flex; gap: 4px; flex-wrap: wrap; }

  /* PROGRESS BAR */
  .prog-bar { height: 3px; background: var(--outline); border-radius: 2px; overflow: hidden; margin-top: 6px; }
  .prog-fill { height: 100%; background: var(--cyan); border-radius: 2px; transition: width 0.3s; }
  .prog-fill.amber { background: var(--amber); }
  .prog-fill.green { background: var(--green); }

  /* TABLE */
  .data-table { width: 100%; border-collapse: collapse; font-size: 11px; }
  .data-table th { font-family: var(--mono); font-size: 9px; color: var(--on-bg-dim); letter-spacing: 0.1em; text-transform: uppercase; padding: 8px 12px; border-bottom: 1px solid var(--outline); text-align: left; background: var(--bg-low); }
  .data-table td { padding: 9px 12px; border-bottom: 1px solid var(--outline); color: var(--on-bg-muted); vertical-align: middle; }
  .data-table td:first-child { color: var(--on-bg); font-weight: 500; }
  .data-table tr:last-child td { border-bottom: none; }
  .data-table tr:hover td { background: rgba(255,255,255,0.02); }

  /* INPUT */
  .form-input {
    width: 100%; background: var(--bg-dim); border: 1px solid var(--outline-hi); border-radius: 4px;
    padding: 8px 10px; color: var(--on-bg); font-size: 12px; font-family: var(--sans); outline: none; transition: border 0.15s;
  }
  .form-input:focus { border-color: var(--cyan-dim); }
  .form-input::placeholder { color: var(--on-bg-dim); }
  .form-label { font-family: var(--mono); font-size: 9px; color: var(--on-bg-muted); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 5px; display: block; }
  .form-group { margin-bottom: 12px; }

  select.form-input { cursor: pointer; }
  textarea.form-input { resize: vertical; min-height: 72px; font-family: var(--sans); }

  /* PARAM BOX */
  .param-box { background: var(--bg-dim); border: 1px solid var(--outline); border-radius: 4px; padding: 10px 12px; }
  .param-label { font-family: var(--mono); font-size: 9px; color: var(--on-bg-dim); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 4px; }
  .param-value { font-family: var(--mono); font-size: 18px; font-weight: 700; color: var(--cyan); }
  .param-unit { font-size: 11px; color: var(--on-bg-muted); }

  /* INLINE SEGMENTED BAR */
  .seg-bar { display: flex; gap: 2px; margin-top: 4px; }
  .seg { height: 4px; width: 18px; border-radius: 2px; background: var(--outline); }
  .seg.on { background: var(--cyan); }
  .seg.on-amber { background: var(--amber); }

  /* MASTER TIP */
  .master-tip { background: rgba(245,166,35,0.07); border: 1px solid rgba(245,166,35,0.25); border-left: 3px solid var(--amber); border-radius: 4px; padding: 10px 12px; }
  .master-tip-label { font-family: var(--mono); font-size: 9px; font-weight: 700; color: var(--amber); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 5px; display: flex; align-items: center; gap: 5px; }
  .master-tip-label svg { width: 11px; height: 11px; stroke: var(--amber); fill: none; }

  /* WARNING BOX */
  .warning-box { background: rgba(224,82,82,0.07); border: 1px solid rgba(224,82,82,0.25); border-left: 3px solid var(--red); border-radius: 4px; padding: 10px 12px; }

  /* SOURCE CITATION */
  .source-item { display: flex; align-items: center; gap: 8px; padding: 7px 10px; background: var(--bg-dim); border: 1px solid var(--outline); border-radius: 4px; cursor: pointer; transition: all 0.15s; margin-bottom: 6px; }
  .source-item:hover { border-color: var(--cyan-dim); }
  .source-icon { width: 26px; height: 26px; border-radius: 3px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .source-icon.video { background: rgba(86,180,211,0.15); }
  .source-icon.doc { background: rgba(76,175,125,0.15); }
  .source-icon svg { width: 13px; height: 13px; stroke: currentColor; fill: none; }
  .source-icon.video svg { stroke: var(--cyan); }
  .source-icon.doc svg { stroke: var(--green); }
  .source-title { font-size: 11px; font-weight: 500; color: var(--on-bg); }
  .source-meta { font-family: var(--mono); font-size: 9px; color: var(--on-bg-dim); letter-spacing: 0.06em; }

  /* CHAT */
  .chat-area { display: flex; flex-direction: column; height: 100%; }
  .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .chat-messages::-webkit-scrollbar { width: 4px; }
  .chat-messages::-webkit-scrollbar-thumb { background: var(--outline-hi); border-radius: 2px; }
  .chat-input-area { padding: 12px 16px; border-top: 1px solid var(--outline); background: var(--bg-low); }
  .chat-input-row { display: flex; gap: 8px; align-items: flex-end; }
  .chat-input { flex: 1; background: var(--bg-dim); border: 1px solid var(--outline-hi); border-radius: 5px; padding: 8px 12px; color: var(--on-bg); font-size: 12px; resize: none; outline: none; font-family: var(--sans); min-height: 38px; }
  .chat-input:focus { border-color: var(--cyan-dim); }
  .send-btn { width: 36px; height: 36px; border-radius: 4px; background: rgba(86,180,211,0.2); border: 1px solid var(--cyan-dim); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  .send-btn svg { width: 15px; height: 15px; stroke: var(--cyan-bright); fill: none; }
  .context-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }

  .user-bubble { align-self: flex-end; max-width: 70%; background: rgba(86,180,211,0.1); border: 1px solid rgba(86,180,211,0.25); border-radius: 6px 6px 2px 6px; padding: 10px 13px; }
  .user-bubble-meta { font-family: var(--mono); font-size: 9px; color: var(--on-bg-dim); text-align: right; margin-top: 4px; }
  .ai-bubble { align-self: flex-start; max-width: 90%; width: 90%; }
  .ai-bubble-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .ai-avatar { font-family: var(--mono); font-size: 9px; color: var(--cyan); background: rgba(86,180,211,0.15); border: 1px solid rgba(86,180,211,0.3); padding: 2px 7px; border-radius: 3px; }
  .ai-status { font-family: var(--mono); font-size: 9px; color: var(--green); letter-spacing: 0.08em; }
  .ai-content { background: var(--bg-mid); border: 1px solid var(--outline); border-radius: 4px; padding: 12px 14px; }

  /* PHOTO FEEDBACK */
  .upload-zone { border: 2px dashed var(--outline-hi); border-radius: 6px; padding: 32px; display: flex; flex-direction: column; align-items: center; gap: 10px; cursor: pointer; transition: all 0.15s; text-align: center; }
  .upload-zone:hover { border-color: var(--cyan-dim); background: rgba(86,180,211,0.04); }
  .upload-icon { width: 48px; height: 48px; border-radius: 50%; background: rgba(86,180,211,0.1); border: 1px solid rgba(86,180,211,0.3); display: flex; align-items: center; justify-content: center; }
  .upload-icon svg { width: 22px; height: 22px; stroke: var(--cyan); fill: none; stroke-width: 1.5; }
  .weld-image { width: 100%; height: 280px; background: linear-gradient(135deg, #0a0f1a, #1a2030); border-radius: 5px; position: relative; overflow: hidden; border: 1px solid var(--outline); }
  .weld-bead { position: absolute; left: 10%; right: 10%; top: 50%; transform: translateY(-50%); }

  /* ARCHIVE */
  .archive-item { background: var(--bg-hi); border: 1px solid var(--outline); border-radius: 5px; padding: 12px 14px; cursor: pointer; transition: all 0.15s; margin-bottom: 8px; }
  .archive-item:hover { border-color: var(--cyan-dim); }
  .archive-item-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .archive-item-title { font-size: 12px; font-weight: 600; color: var(--on-bg); flex: 1; }
  .archive-item-meta { font-family: var(--mono); font-size: 9px; color: var(--on-bg-dim); display: flex; gap: 10px; }

  /* CONFIDENCE BAR */
  .conf-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .conf-label { font-size: 11px; color: var(--on-bg); width: 140px; flex-shrink: 0; }
  .conf-track { flex: 1; height: 6px; background: var(--outline); border-radius: 3px; overflow: hidden; }
  .conf-fill { height: 100%; border-radius: 3px; }
  .conf-pct { font-family: var(--mono); font-size: 10px; width: 40px; text-align: right; flex-shrink: 0; }

  /* BBOX */
  .bbox { position: absolute; border: 2px solid; border-radius: 3px; pointer-events: none; }
  .bbox-label { position: absolute; top: -18px; left: 0; font-family: var(--mono); font-size: 9px; font-weight: 700; padding: 2px 5px; border-radius: 2px; white-space: nowrap; }

  /* SECTION HEADER */
  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .section-title { font-size: 12px; font-weight: 600; color: var(--on-bg); display: flex; align-items: center; gap: 7px; }
  .section-title svg { width: 13px; height: 13px; stroke: var(--cyan); fill: none; }

  /* SCROLLBAR GLOBAL */
  * { scrollbar-width: thin; scrollbar-color: var(--outline-hi) transparent; }

  /* SUGGEST PROMPTS */
  .suggest-prompt { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 3px; border: 1px solid var(--outline-hi); background: var(--bg-hi); cursor: pointer; font-size: 11px; color: var(--on-bg-muted); transition: all 0.15s; }
  .suggest-prompt:hover { border-color: var(--cyan-dim); color: var(--cyan); }

  /* INSIGHT DRAWER */
  .insight-drawer { width: 220px; min-width: 220px; border-left: 1px solid var(--outline); background: var(--bg-low); display: flex; flex-direction: column; z-index: 5; flex-shrink: 0; overflow: hidden; }
  .drawer-header { padding: 10px 12px; border-bottom: 1px solid var(--outline); background: var(--bg-dim); }
  .drawer-section { padding: 12px; border-bottom: 1px solid var(--outline); }
  .drawer-label { font-family: var(--mono); font-size: 9px; color: var(--on-bg-dim); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 8px; }

  /* COVERAGE BAR */
  .cov-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; font-size: 10px; }
  .cov-name { color: var(--on-bg-muted); width: 72px; flex-shrink: 0; }
  .cov-bar { flex: 1; height: 5px; background: var(--outline); border-radius: 3px; overflow: hidden; }
  .cov-fill { height: 100%; border-radius: 3px; background: var(--cyan); }
  .cov-pct { font-family: var(--mono); font-size: 9px; color: var(--on-bg-dim); width: 28px; text-align: right; }

  /* CHECKLIST */
  .check-item { display: flex; align-items: flex-start; gap: 8px; padding: 7px 10px; background: var(--bg-dim); border: 1px solid var(--outline); border-radius: 4px; margin-bottom: 5px; }
  .check-box { width: 14px; height: 14px; border: 1px solid var(--outline-hi); border-radius: 2px; flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .check-box.done { background: rgba(76,175,125,0.2); border-color: var(--green); }
  .check-box.done::after { content: '✓'; font-size: 9px; color: var(--green); }
  .check-text { font-size: 11px; color: var(--on-bg-muted); }
  .check-sub { font-size: 10px; color: var(--on-bg-dim); margin-top: 2px; }

  .divider { height: 1px; background: var(--outline); margin: 12px 0; }

  /* VIDEO DETAIL */

function sendSuggest(text) {
  const input = document.getElementById('chat-input');
  if (input) input.value = text;
}

function sendChatMessage() {
  const input = document.getElementById('chat-input');
  if (!input || !input.value.trim()) return;
  const userMsg = {type:'user', text: input.value, time: new Date().toLocaleTimeString('ko-KR', {hour12:false})};
  if (chatMessages.length === 0) chatMessages = getDefaultChatMessages();
  chatMessages.push(userMsg);
  input.value = '';
  render();
  const container = document.getElementById('chat-messages');
  if (container) container.scrollTop = container.scrollHeight;
}

                <span style="font-size:11px;color:${s.done?'var(--on-bg)':'var(--on-bg-dim)'}">${s.label}</span>
              </div>
            `).join('')}
          </div>
        </div>

        <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="navigate('chat')">
          이 지식으로 챗봇 질문
        </button>
      </div>
    </div>
  </div>
  `;
}

function backToArchive() {
  archiveView = 'list';

}

function getArchiveTypeChipClass(type) {
  const map = {'숙련공 팁':'chip-amber','파라미터 가이드':'chip-cyan','결함 해결법':'chip-red','Q&A':'chip-gray','자세 노트':'chip-green','영상 근거':'chip-cyan'};
  return map[type] || 'chip-gray';
}

function getStatusChipClass(status) {
  const map = {'인덱싱 완료':'chip-green','검토 완료':'chip-cyan','근거 부족':'chip-red','초안':'chip-gray'};

}

function attachHandlers() {
  // Focus scroll for chat
  if (currentScreen === 'chat') {
    const container = document.getElementById('chat-messages');
    if (container) container.scrollTop = container.scrollHeight;
    const input = document.getElementById('chat-input');
    if (input) {
      input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChatMessage(); }
      });
    }
  }
}
